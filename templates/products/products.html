{% extends 'base.html' %}

{% block content %}
<div class="products-grid">
  {% for p in pro %}
  <div class="product-card">
    <img src="{{ p.image.url }}" alt="{{ p.name }}">
    <h3>{{ p.name }}</h3>
    <p class="price">${{ p.price }}</p>
  </div>
  {% endfor %}
</div>
{% endblock content %}

{% block extra_css %}
<style>
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 30px;
  }
  .product-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: transform 0.15s;
  }
  .product-card:hover {
    transform: translateY(-4px);
  }
  .product-card img {
    max-width: 100%;
    height: 180px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  .product-card h3 {
    margin: 0 0 8px;
    font-size: 18px;
  }
  .product-card .price {
    color: #2e7d32;
    font-weight: bold;
    font-size: 16px;
  }
</style>
{% endblock %}
